plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.0'
    // 1. NEU: Das offizielle Paper-Entwicklungs- und Run-Plugin
    id 'xyz.jpenilla.run-paper' version '2.3.1'
}

group = 'eu.goodyfx'
version = '1.0-SNAPSHOT'

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(25))
}

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = uri("https://repo.papermc.io/repository/maven-public/")
    }
    // Repositories für deine Abhängigkeiten (falls benötigt, z.B. für LuckPerms API)
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}

dependencies {
    // Paper API (holt Gradle direkt aus dem Online-Repo)
    compileOnly("io.papermc.paper:paper-api:26.1.2.build.+")

    // Bibliotheken, die mit in dein Plugin gepackt (geshadet) werden
    implementation 'io.javalin:javalin:6.1.3'
    implementation 'org.slf4j:slf4j-simple:2.0.12'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Lokale Plugins als Abhängigkeit für die Kompilierung
    compileOnly fileTree(dir: "E:/Programme/InteliJ/InteliJ Projects/Minecraft Server/plugins", include: [
            "LuckPerms*.jar",
            "ProtocolLib*.jar",
            "nuvotifier*.jar"
    ])

    // Lombok
    compileOnly("org.projectlombok:lombok:1.18.46")
    annotationProcessor("org.projectlombok:lombok:1.18.46")
}

shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()
    relocate 'io.javalin', 'eu.goodyfx.mcraspi.libs.javalin'
    relocate 'org.eclipse.jetty', 'eu.goodyfx.mcraspi.libs.jetty'
}

processResources {
    inputs.property("version", project.version)
    filesMatching("plugin.yml") {
        expand(version: project.version)
    }
}




// Task 1: Nur lokal auf deinen E:/.../ Server kopieren
tasks.register('copyToLocalServer', Copy) {
    dependsOn(tasks.shadowJar)
    from shadowJar.archiveFile
    into file("E:/Programme/InteliJ/InteliJ Projects/Minecraft Server/plugins")
    rename { "McRaspiSystem.jar" }
}

tasks.named('build'){
    dependsOn('copyToLocalServer')
}

// Task 2: Nur ausführen, wenn du es WIRKLICH auf den Remote-Server via SCP laden willst
tasks.register('deployRemote', Exec) {
    dependsOn(tasks.shadowJar)

    // Hier sagen wir Gradle direkt, was ausgeführt werden soll
    executable 'cmd'
    args '/c', 'start', 'cmd', '/k', "scp -P ${port} \"${shadowJar.archiveFile.get().asFile.absolutePath}\" ${user}@${location}"

    // Das println packen wir in ein doFirst, damit es vor dem Befehl im Terminal steht
    doFirst {
        println "Öffne Passwort-Eingabe für SCP Upload..."
    }
}